[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "taxjar_integration"
authors = [
    {name = "Frappe Technologies Pvt. Ltd.", email = "developers@frappe.io"}
]
dynamic = ["version"]
description = "TaxJar Integration with ERPNext"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}

dependencies = [
    "taxjar~=2.0.1",
]

[project.urls]
Homepage = "https://github.com/frappe/taxjar_integration"
Repository = "https://github.com/frappe/taxjar_integration"
"Bug Reports" = "https://github.com/frappe/taxjar_integration/issues/new"

[tool.bench.frappe-dependencies]
frappe = ">=17.0.0-dev,<18.0.0"
erpnext = ">=17.0.0-dev,<18.0.0"

[tool.isort]
profile = "black"
skip_gitignore = true
line_length = 99

[tool.black]
line-length = 99
