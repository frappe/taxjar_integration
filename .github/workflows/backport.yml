name: Backport

# A pull request merged into develop with the label "backport version-16" gets
# a second pull request that cherry-picks its commits onto version-16. The
# label names the target branch, so "backport version-17" works the same way
# once that branch exists. pull_request_target runs this file from develop,
# not from the pull request, so a fork cannot change what runs here.
on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Backport
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Open the backport pull requests
        uses: korthout/backport-action@v4
        with:
          label_pattern: '^backport ([^ ]+)$'
