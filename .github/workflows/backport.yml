name: Backport

# A pull request merged into develop with the label "backport-version-16" gets
# a second pull request that cherry-picks its commits onto version-16. The
# label names the target branch, so "backport-version-17" works the same way
# once that branch exists. pull_request_target runs this file from develop,
# not from the pull request, so a fork cannot change what runs here.
on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Backport
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Open the backport pull requests
        id: backport
        uses: korthout/backport-action@v4
        with:
          label_pattern: '^backport-([^ ]+)$'

      # GitHub starts no workflow for a pull request that a workflow opened,
      # and nobody is there to comment /run. So this step starts the PR run
      # for each backport pull request.
      - name: Start the PR run on the backport pull requests
        if: steps.backport.outputs.created_pull_numbers
        uses: actions/github-script@v7
        env:
          NUMBERS: ${{ steps.backport.outputs.created_pull_numbers }}
        with:
          script: |
            for (const number of process.env.NUMBERS.split(/\s+/).filter(Boolean)) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'pr-run.yml',
                ref: context.payload.repository.default_branch,
                inputs: { pr: number },
              });
              core.info(`Started the PR run for #${number}.`);
            }
