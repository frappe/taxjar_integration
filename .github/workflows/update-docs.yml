name: Update docs

on:
  issue_comment:
    types: [created]

# One run per PR at a time. A second /update-docs waits for the first, so two
# runs never push to the same branch together.
concurrency:
  group: update-docs-${{ github.event.issue.number }}
  cancel-in-progress: false

# The runner's own deploy key, with write access to the fork only. Set here
# and not in ~/.ssh/config, so other tools of the runner user keep their keys.
env:
  GIT_SSH_COMMAND: ssh -i ~/.ssh/docs_runner -o IdentitiesOnly=yes

jobs:
  # Runs on the self-hosted runner, where Claude Code is installed and signed
  # in. The repository is public, so only a comment from someone with write
  # access starts it: the job checks out the PR branch and runs its npm
  # install, and that must never happen for a stranger's comment.
  #
  # Text after "/update-docs" goes to Claude as extra instructions. That is how
  # a reviewer asks for changes: reject the pending apply job, then comment
  # "/update-docs <what to change>".
  propose:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/update-docs') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: [self-hosted, docs]
    timeout-minutes: 30
    name: Propose docs

    permissions:
      contents: read
      pull-requests: write

    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}

    steps:
      - name: Read the PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('head_repo', pr.head.repo.full_name);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      # Over SSH with the runner's own key, not with GITHUB_TOKEN: the PR
      # branch is usually on a fork, and GITHUB_TOKEN cannot push to a fork.
      - name: Check out the PR branch
        env:
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          rm -rf pr && git clone --quiet "git@github.com:${HEAD_REPO}.git" pr
          cd pr
          git checkout --quiet "$HEAD_SHA"
          git fetch --quiet "https://github.com/${GITHUB_REPOSITORY}.git" "$BASE_REF:base"

      - name: Update the docs
        working-directory: pr
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          EXTRA="${COMMENT#/update-docs}"
          claude -p --permission-mode acceptEdits \
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(python3 scripts/lint.py),Bash(npm run docs:build)" \
            "Update the docs in docs/ for the code changes of this pull request.
          1. Read the changes with: git diff base...HEAD -- taxjar_integration
          2. Read docs/STYLE.md. Follow its owner pages, terms and editorial patterns.
          3. Change only the pages that the code change makes wrong or incomplete. Do not rewrite other pages.
          4. You cannot take screenshots. If a screenshot is now out of date, do not change it; name it in your summary.
          5. In docs/, run: python3 scripts/lint.py and npm run docs:build. Fix every error.
          End with a short summary in Markdown: the pages that you changed, and the screenshots that are out of date.
          Instructions from the reviewer, if any: ${EXTRA}" \
            > ../summary.md

      - name: Check the docs
        working-directory: pr/docs
        run: |
          npm ci --no-audit --no-fund
          python3 scripts/lint.py
          npm run docs:build

      - name: Make the patch
        id: diff
        working-directory: pr
        run: |
          git add -N docs
          git diff -- docs > ../docs.patch
          if [ -s ../docs.patch ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Keep the patch for the apply job
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-patch
          path: docs.patch
          retention-days: 7

      - name: Post the proposal on the PR
        if: always()
        uses: actions/github-script@v7
        env:
          CHANGED: ${{ steps.diff.outputs.changed }}
        with:
          script: |
            const fs = require('fs');
            const read = (file) => (fs.existsSync(file) ? fs.readFileSync(file, 'utf8').trim() : '');
            const summary = read('summary.md');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            if (process.env.CHANGED === 'true') {
              let diff = read('docs.patch');
              if (diff.length > 50000) diff = diff.slice(0, 50000) + '\n… (cut; the full patch is in the run artifacts)';
              body = [
                '### Proposed docs update',
                '',
                summary,
                '',
                '<details><summary>Diff</summary>',
                '',
                '```diff',
                diff,
                '```',
                '',
                '</details>',
                '',
                `**Nothing is pushed yet.** [Review the run](${run}): **Approve** the "docs-approval" step to commit this to the PR, or **Reject** it and comment \`/update-docs <what to change>\` for a new proposal.`,
              ].join('\n');
            } else if (process.env.CHANGED === 'false') {
              body = `### No docs change needed\n\n${summary}`;
            } else {
              body = `The docs proposal failed. See the [run log](${run}).`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  # Waits for a required reviewer of the "docs-approval" environment. Nothing
  # reaches the PR branch until a person approves the diff in the comment.
  apply:
    needs: propose
    if: needs.propose.outputs.changed == 'true'
    runs-on: [self-hosted, docs]
    timeout-minutes: 10
    name: Apply docs
    environment: docs-approval

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Get the patch
        uses: actions/download-artifact@v4
        with:
          name: docs-patch

      - name: Commit and push
        env:
          HEAD_REPO: ${{ needs.propose.outputs.head_repo }}
          HEAD_REF: ${{ needs.propose.outputs.head_ref }}
        run: |
          rm -rf pr && git clone --quiet "git@github.com:${HEAD_REPO}.git" pr
          cd pr
          git checkout --quiet "$HEAD_REF"
          # Fails if the PR changed the same docs lines after the proposal.
          # Then comment /update-docs again for a fresh proposal.
          git apply --index ../docs.patch
          git -c user.name="Docs Bot" -c user.email="docs-bot@users.noreply.github.com" \
            commit --quiet -m "docs: update the docs for this change"
          git push --quiet origin "HEAD:${HEAD_REF}"

      - name: Report on the PR
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ job.status }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = process.env.OUTCOME === 'success'
              ? 'Docs commit pushed to this PR.'
              : `The docs commit failed. The PR may have changed since the proposal. See the [run log](${run}), or comment \`/update-docs\` again.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
